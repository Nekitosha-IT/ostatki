name: Inspect uploaded archive
on:
  push:
    paths:
      - ".github/workflows/inspect-archive.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List and inspect archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          mkdir -p /tmp/ost
          7z x "Остатки- 15-10-2026.rar" -o/tmp/ost -y >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("/tmp/ost/Остатки.xml")
          def local(tag):
              return tag.rsplit("}", 1)[-1]
          print("=== ALL OCCURRENCES OF TARGET DOCUMENT TYPE ===")
          total = 0
          for _, el in ET.iterparse(p, events=("end",)):
              tag = local(el.tag)
              if "ОстаткиСобственныхТМЦ" in tag:
                  total += 1
                  print(f"OBJECT #{total}: tag={tag}")
                  for child in list(el):
                      name = local(child.tag)
                      if name in ("Склад", "СтруктурнаяЕдиница"):
                          val = "".join(child.itertext()).strip().replace("\\n", " ")
                          print(f"  {name}: {val[:300]}")
                          print("  nested tags:", [local(x.tag) for x in list(child)])
                      else:
                          text = "".join(child.itertext()).strip().replace("\\n", " ")
                          print(f"  {name}: {text[:120]}")
                  if total >= 10:
                      break
              el.clear()
          print("TOTAL_MATCHES_SCANNED:", total)
          PY
          echo "=== RAW XML MATCHES FOR TARGET ==="
          grep -n -m 10 -E 'Документ\.ОстаткиСобственныхТМЦ|ОстаткиСобственныхТМЦ' /tmp/ost/Остатки.xml || true
